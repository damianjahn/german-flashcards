<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2eb" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Wortschatz" />
  <title>Wortschatz — German flashcards</title>
  <style>
    :root { --ink:#18201d; --muted:#6e766f; --paper:#f6f2eb; --card:#fffdf9; --line:#ded9ce; --sage:#dce9d5; --green:#255c3d; --coral:#efc9b8; --red:#9b3c2e; --yellow:#f7df8b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; background:var(--paper); color:var(--ink); font:16px/1.45 ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button,input,textarea { font:inherit; }
    button { cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .app { width:min(100%, 560px); min-height:100dvh; margin:auto; padding:max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
    .brand { display:flex; align-items:center; gap:9px; font-size:21px; font-weight:800; letter-spacing:-.8px; }
    .brand span { color:var(--green); }
    .flag { width:27px; height:19px; border:1px solid #d8d1c4; border-radius:4px; background:linear-gradient(to bottom,#1c211f 0 33.33%,#d43c32 33.33% 66.66%,#f1c844 66.66%); box-shadow:0 1px 2px rgba(30,25,18,.12); }
    .icon-button { width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:var(--card); color:var(--ink); font-size:26px; line-height:1; }
    .icon-button:active,.choice:active { transform:scale(.97); }
    .progress-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; color:var(--muted); font-size:14px; }
    .progress-row strong { color:var(--ink); font-size:15px; }
    .progress { height:7px; border-radius:10px; overflow:hidden; background:#e7e2d9; margin-bottom:30px; }
    .progress > i { display:block; height:100%; background:var(--green); border-radius:inherit; transition:width .25s; }
    main { flex:1; display:flex; flex-direction:column; }
    .card-wrap { height:clamp(270px, 47svh, 420px); flex:none; }
    .card { height:100%; position:relative; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .face { position:absolute; inset:0; border:1px solid var(--line); border-radius:26px; padding:28px; background:var(--card); box-shadow:0 10px 24px rgba(52,45,30,.07); display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; transition:opacity .22s ease, transform .22s ease; }
    .back { opacity:0; transform:scale(.97); pointer-events:none; background:var(--sage); }
    .card.flipped > .face:not(.back) { opacity:0; transform:scale(.97); pointer-events:none; }
    .card.flipped > .back { opacity:1; transform:scale(1); pointer-events:auto; }
    .label { position:absolute; top:27px; left:28px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .word { font-size:clamp(35px, 9vw, 52px); font-weight:800; letter-spacing:-2px; line-height:1.1; overflow-wrap:anywhere; }
    .hint { position:absolute; bottom:25px; color:var(--muted); font-size:14px; }
    .translation { margin-top:13px; color:var(--green); font-size:17px; font-weight:700; }
    .counter { position:absolute; bottom:23px; display:flex; align-items:center; gap:7px; color:var(--green); font-size:14px; font-weight:700; }
    .dots { letter-spacing:1px; color:#6c9d7c; }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:21px; }
    .choice { min-height:64px; border:0; border-radius:17px; font-weight:800; font-size:16px; transition:transform .15s; }
    .choice.no { background:var(--coral); color:#662d24; }
    .choice.yes { background:var(--green); color:white; }
    .choice:disabled { opacity:.45; cursor:not-allowed; }
    .empty { flex:1; border:1px dashed #c9c2b5; border-radius:26px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:34px; text-align:center; background:rgba(255,253,249,.55); }
    .empty h2 { margin:14px 0 5px; font-size:25px; letter-spacing:-.8px; }
    .empty p { margin:0; color:var(--muted); max-width:290px; }
    .empty-icon { width:58px; height:58px; border-radius:19px; background:var(--yellow); display:grid; place-items:center; font-size:27px; }
    .empty button,.primary { margin-top:23px; padding:13px 19px; border:0; border-radius:13px; background:var(--green); color:white; font-weight:800; }
    .footer { padding-top:22px; text-align:center; color:var(--muted); font-size:13px; }
    dialog { width:min(calc(100% - 32px), 480px); border:0; border-radius:24px; padding:0; background:var(--card); box-shadow:0 18px 55px rgba(25,30,24,.25); }
    dialog::backdrop { background:rgba(20,28,23,.35); backdrop-filter:blur(2px); }
    .modal { padding:25px; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
    .modal h2 { margin:0; font-size:24px; letter-spacing:-.8px; }
    .close { border:0; background:none; font-size:29px; color:var(--muted); padding:0 4px; }
    label { display:block; margin:15px 0 7px; font-size:14px; font-weight:750; }
    input,textarea { width:100%; padding:14px 15px; border:1px solid var(--line); border-radius:13px; outline:none; background:#fff; color:var(--ink); }
    textarea { min-height:185px; resize:vertical; line-height:1.45; }
    input:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(37,92,61,.13); }
    .add-modes { display:flex; gap:7px; margin:-2px 0 15px; }
    .add-mode { border:0; border-radius:10px; padding:8px 11px; background:#eee9df; color:var(--muted); font-size:13px; font-weight:750; }
    .add-mode.active { background:var(--sage); color:var(--green); }
    .helper { margin:7px 0 0; color:var(--muted); font-size:13px; }
    .batch-error { min-height:19px; margin:8px 0 0; color:var(--red); font-size:13px; font-weight:700; }
    .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:23px; }
    .secondary { padding:12px 15px; border:1px solid var(--line); border-radius:12px; background:white; font-weight:700; }
    .primary { margin:0; padding:12px 17px; }
    .manage-list { max-height:310px; overflow:auto; margin:0 -5px; padding:0 5px; }
    .manage-item { display:flex; gap:10px; justify-content:space-between; align-items:center; padding:13px 0; border-bottom:1px solid #eee9df; }
    .manage-item:last-child { border:0; }
    .pair { min-width:0; } .pair strong,.pair span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .pair span { color:var(--muted); font-size:14px; }
    .delete { border:0; background:#f9e3da; color:var(--red); border-radius:10px; padding:8px 10px; font-size:13px; font-weight:750; }
    .tabs { display:flex; gap:8px; margin:-3px 0 16px; } .tab { border:0; background:#eee9df; color:var(--muted); padding:8px 11px; border-radius:10px; font-size:13px; font-weight:750; } .tab.active { background:var(--sage); color:var(--green); }
    @media (max-height:700px) { header { margin-bottom:16px; } .progress { margin-bottom:18px; } .card-wrap { height:260px; } .face { border-radius:22px; } .choices { margin-top:14px; } }
  </style>
</head>
<body>
  <div class="app">
    <header><div class="brand"><i class="flag" aria-hidden="true"></i><div>Wort<span>schatz</span></div></div><button class="icon-button" id="addButton" aria-label="Add a word">+</button></header>
    <main>
      <div id="studyView">
        <div class="progress-row"><span id="cardCount">0 cards to learn</span><strong id="progressText">0 / 10 known</strong></div>
        <div class="progress"><i id="progressBar"></i></div>
        <div class="card-wrap"><div class="card" id="card" role="button" tabindex="0" aria-label="Flip card"><section class="face"><span class="label">Polish</span><div class="word" id="polishWord"></div><span class="hint">Tap to reveal German</span></section><section class="face back"><span class="label">German</span><div class="word" id="germanWord"></div><div class="translation" id="exampleText"></div><div class="counter">Known <span class="dots" id="dotCounter"></span></div></section></div></div>
        <div class="choices"><button class="choice no" id="againButton">Not yet</button><button class="choice yes" id="knowButton">I know it</button></div>
      </div>
      <div class="empty" id="emptyView" hidden><div class="empty-icon">✦</div><h2>Ready for your words</h2><p>Add a Polish–German pair and begin your own vocabulary practice.</p><button id="emptyAdd">Add your first word</button></div>
    </main>
    <div class="footer"><button class="secondary" id="manageButton">Manage words <span id="archiveCount"></span></button></div>
  </div>

  <dialog id="addDialog"><form class="modal" id="addForm"><div class="modal-header"><h2>Add words</h2><button class="close" type="button" data-close="addDialog">×</button></div><div class="add-modes"><button class="add-mode active" type="button" data-add-mode="single">One card</button><button class="add-mode" type="button" data-add-mode="batch">Paste a list</button></div><div id="singleFields"><label for="polishInput">Polish word or sentence</label><input id="polishInput" required autocomplete="off" placeholder="e.g. książka" /><label for="germanInput">German translation</label><input id="germanInput" required autocomplete="off" placeholder="e.g. das Buch" /></div><div id="batchFields" hidden><label for="batchInput">Word pairs</label><textarea id="batchInput" disabled spellcheck="false" placeholder="książka | das Buch\nDzisiaj jest zimno. | Heute ist es kalt.\nChcę nauczyć się niemieckiego. | Ich möchte Deutsch lernen."></textarea><p class="helper">One pair per line. Put a <strong>|</strong> between Polish and German. Phrases and full sentences work too.</p><p class="batch-error" id="batchError" aria-live="polite"></p></div><div class="form-actions"><button class="secondary" type="button" data-close="addDialog">Cancel</button><button class="primary" type="submit" id="addSubmit">Add card</button></div></form></dialog>
  <dialog id="manageDialog"><div class="modal"><div class="modal-header"><h2>Your words</h2><button class="close" type="button" data-close="manageDialog">×</button></div><div class="tabs"><button class="tab active" data-list="active">Learning</button><button class="tab" data-list="archived">Archived</button></div><div class="manage-list" id="manageList"></div></div></dialog>
  <script>
    const KEY = 'wortschatz-cards-v1';
    let cards = JSON.parse(localStorage.getItem(KEY) || '[]');
    let currentIndex = 0, listMode = 'active';
    const $ = id => document.getElementById(id);
    const save = () => localStorage.setItem(KEY, JSON.stringify(cards));
    const activeCards = () => cards.filter(c => !c.archived);
    const escapeHtml = s => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function render() {
      const active = activeCards();
      $('studyView').hidden = !active.length; $('emptyView').hidden = !!active.length;
      $('archiveCount').textContent = cards.filter(c => c.archived).length ? `· ${cards.filter(c => c.archived).length} archived` : '';
      if (!active.length) return;
      if (currentIndex >= active.length) currentIndex = 0;
      const c = active[currentIndex];
      $('polishWord').textContent = c.polish; $('germanWord').textContent = c.german;
      $('cardCount').textContent = `${active.length} card${active.length === 1 ? '' : 's'} to learn`;
      $('progressText').textContent = `${c.known} / 10 known`;
      $('progressBar').style.width = `${c.known * 10}%`;
      $('dotCounter').textContent = '●'.repeat(c.known) + '○'.repeat(10 - c.known);
      $('card').classList.remove('flipped');
    }
    function answer(known) {
      const active = activeCards(); if (!active.length) return;
      const c = active[currentIndex];
      if (known) { c.known++; if (c.known >= 10) c.archived = true; }
      else c.known = Math.max(0, c.known - 1);
      save(); render();
    }
    function renderList() {
      const selected = cards.filter(c => listMode === 'archived' ? c.archived : !c.archived);
      $('manageList').innerHTML = selected.length ? selected.map(c => `<div class="manage-item"><div class="pair"><strong>${escapeHtml(c.polish)}</strong><span>${escapeHtml(c.german)} · ${c.known}/10 known</span></div><button class="delete" data-delete="${c.id}">Delete</button></div>`).join('') : `<p style="color:var(--muted);text-align:center;padding:25px 0">No ${listMode} cards yet.</p>`;
      document.querySelectorAll('[data-delete]').forEach(b => b.onclick = () => { cards = cards.filter(c => c.id !== b.dataset.delete); save(); renderList(); render(); });
    }
    let addMode = 'single';
    function setAddMode(mode) { addMode = mode; const batch = mode === 'batch'; $('singleFields').hidden = batch; $('batchFields').hidden = !batch; $('polishInput').disabled = batch; $('germanInput').disabled = batch; $('batchInput').disabled = !batch; $('addSubmit').textContent = batch ? 'Add cards' : 'Add card'; $('batchError').textContent = ''; document.querySelectorAll('[data-add-mode]').forEach(b => b.classList.toggle('active', b.dataset.addMode === mode)); }
    function openAddDialog() { setAddMode('single'); $('addDialog').showModal(); }
    $('addButton').onclick = openAddDialog; $('emptyAdd').onclick = openAddDialog;
    $('manageButton').onclick = () => { listMode = 'active'; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.list === listMode)); renderList(); $('manageDialog').showModal(); };
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $(b.dataset.close).close());
    document.querySelectorAll('[data-add-mode]').forEach(b => b.onclick = () => setAddMode(b.dataset.addMode));
    $('addForm').onsubmit = e => { e.preventDefault(); let additions; if (addMode === 'single') additions = [{polish:$('polishInput').value.trim(), german:$('germanInput').value.trim()}]; else { const invalid = []; additions = $('batchInput').value.split(/\r?\n/).map((line, i) => { const cut = line.indexOf('|'); const pair = cut < 0 ? null : {polish:line.slice(0,cut).trim(), german:line.slice(cut+1).trim()}; if (line.trim() && (!pair || !pair.polish || !pair.german)) invalid.push(i + 1); return pair; }).filter(Boolean); if (invalid.length) { $('batchError').textContent = `Check line${invalid.length > 1 ? 's' : ''} ${invalid.join(', ')} — each needs Polish | German.`; return; } if (!additions.length) return; } cards.push(...additions.map(pair => ({id:crypto.randomUUID(), ...pair, known:0, archived:false}))); save(); currentIndex = activeCards().length - 1; e.target.reset(); setAddMode('single'); $('addDialog').close(); render(); };
    $('card').onclick = () => $('card').classList.toggle('flipped'); $('card').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('card').classList.toggle('flipped'); } }; $('againButton').onclick = () => answer(false); $('knowButton').onclick = () => answer(true);
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => { listMode = t.dataset.list; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t)); renderList(); });
    render();
  </script>
</body>
</html>
